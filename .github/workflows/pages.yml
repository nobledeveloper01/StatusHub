# Publishes site/ to GitHub Pages.
#
# The page is plain static HTML with no build step and no external requests, so
# there is nothing to install and nothing that can break between authoring it
# and serving it. Runs only when site/ actually changes, because a docs deploy
# on every unrelated push makes the deploy history useless for answering "when
# did the site last change".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a stale
# one, and these run in seconds anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the page is self-contained
        # A landing page that reaches out to a CDN is a page that breaks when
        # the CDN does, and leaks a visitor's IP to a third party. Neither is
        # acceptable for a static pitch, so it is enforced rather than trusted.
        run: |
          if grep -nEo '(src|href)="https?://[^"]+' site/index.html \
             | grep -vE 'https://github\.com|https://[a-z0-9-]+\.github\.io'; then
            echo "::error::site/index.html loads a remote asset; inline it instead"
            exit 1
          fi
          echo "no remote assets"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
