name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New stdlib CVEs land without us pushing anything, so scan weekly too.
    - cron: '17 6 * * 1'

# go.mod declares the language floor. CI builds with the latest stable
# toolchain instead: govulncheck reports stdlib advisories against the
# toolchain that built the binary, and pinning an old minor pins its
# unpatched standard library along with it.
env:
  GO_VERSION: 'stable'

  # golangci-lint is pinned to a Go version rather than tracking stable.
  #
  # It embeds go/types, which panics on source files declaring a language
  # version newer than the toolchain the linter itself was built with — so the
  # day the runner's "stable" moves ahead of the linter's release, every lint
  # run dies with a stack trace that says nothing about this repository.
  #
  # Everything else deliberately stays on stable: govulncheck reports stdlib
  # advisories against the toolchain that built the binary, and pinning it
  # would pin its unpatched standard library too.
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GOLANGCI_LINT_GO_VERSION: '1.26'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statushub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      STATUSHUB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/statushub_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race -coverpkg=./internal/...,./pkg/... ./tests/...

      # Blocking gate (§8.1): tenant B must never reach tenant A's data,
      # and must get 404 rather than 403 — a 403 confirms the row exists.
      - name: Tenant isolation
        run: go test -race ./tests/... -run 'Store/TenantIsolation' -v

      # Blocking gate (§11.9): every adapter against real captured payloads
      # and against known-good/known-bad signature vectors.
      - name: Adapter corpus and signature vectors
        run: go test -race ./tests/... -run 'Adapter' -v

      # Chaos (§11.9): kill a dispatcher mid-delivery and assert nothing is
      # lost and nothing arrives that the customer cannot deduplicate; kill a
      # receiver between persist and acknowledge and assert the provider's
      # retry produces one canonical event, not four.
      - name: Chaos
        run: go test -race ./tests/... -run 'Chaos' -v

      # The specification is generated from the routes. Regenerating it here
      # means a route added without regenerating fails CI rather than shipping
      # a document that promises endpoints nobody serves.
      - name: OpenAPI document is current
        run: |
          go run ./cmd/statushubctl openapi --version "$(grep -m1 'version:' docs/openapi.yaml | tr -d ' version:"')" --out docs/openapi.yaml
          git diff --exit-code docs/openapi.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Pinned; see GOLANGCI_LINT_GO_VERSION above.
          go-version: ${{ env.GOLANGCI_LINT_GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The fixtures come from the server's own signing code. Regenerating
      # them here means a signing change that the client libraries do not
      # follow fails CI rather than production.
      - name: Regenerate the signature vectors
        run: go test ./tests -run GenerateSDKFixtures

      - name: The vectors must be committed and current
        run: git diff --exit-code sdk/fixtures/

      - name: Node library
        run: |
          cd sdk/node
          npm install --silent
          npm run build
          node --test test/*.test.js

      - name: Python library
        run: |
          cd sdk/python
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Chart lints
        run: helm lint deploy/helm/statushub --set config.baseURL=https://hooks.example.com

      # A required value that is not enforced is a value somebody deploys
      # without, producing receiver URLs nobody can use.
      - name: Required values are enforced
        run: |
          if helm template statushub deploy/helm/statushub >/dev/null 2>&1; then
            echo "the chart rendered without config.baseURL; it must be required"
            exit 1
          fi

      - name: Manifests are valid Kubernetes
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          helm template statushub deploy/helm/statushub \
            --set config.baseURL=https://hooks.example.com \
            | ./kubeconform -summary -strict -ignore-missing-schemas

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform is formatted and valid
        run: |
          terraform -chdir=deploy/terraform fmt -check -diff
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [quality, lint, manifests, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # Dev machines are arm64 and this is amd64: a build that only ever
      # runs locally is a build that only ever works locally.
      - name: Cross build
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: Container image
        run: docker build -t statushub:ci .
