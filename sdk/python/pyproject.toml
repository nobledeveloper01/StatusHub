[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statushub"
version = "1.0.0"
description = "StatusHub client library — verify delivery signatures and read the canonical event schema."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["webhooks", "fintech", "paystack", "flutterwave", "stripe", "statushub"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
# No dependencies. Everything this needs is in the standard library, and a
# fintech's security team has to approve every transitive package.
dependencies = []

[project.urls]
Homepage = "https://github.com/nobledeveloper01/StatusHub"

[tool.setuptools.packages.find]
include = ["statushub*"]
