{{- if eq (include "statushub.isPrimary" .) "true" -}}
{{/*
Rendered only in the primary region.

The event explorer reads the primary, never a replica: a dashboard showing an
event as undelivered because it read a lagging replica would send an operator
to replay something already delivered.
*/}}
{{/*
The management API and dashboard.

Separate from the receiver so that an operator loading the event explorer
during an incident cannot compete for the connection pool the receiver needs
to acknowledge providers.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "statushub.fullname" . }}-api
  labels:
    {{- include "statushub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "statushub.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "statushub.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      {{- include "statushub.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "statushub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--mode", "api", "--listen", ":8080"]
          {{- include "statushub.containerSecurity" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "statushub.env" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 6
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "statushub.fullname" . }}-api
  labels:
    {{- include "statushub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 80, targetPort: http }
  selector:
    app.kubernetes.io/name: {{ include "statushub.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api

{{- end }}
