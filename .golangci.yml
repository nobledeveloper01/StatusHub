version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # leaked HTTP response bodies — the dispatcher lives on this
    - errorlint      # error comparisons that break under wrapping
    - gocritic
    - gosec          # SAST gate (§8.5)
    - misspell
    - nilerr         # returning nil after a non-nil error
    - noctx          # HTTP requests without a context
    - revive
    - unconvert

  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments are reviewed, not linted
    gocritic:
      disabled-checks:
        - ifElseChain

  exclusions:
    rules:
      # Tests use fixed credentials and unchecked helpers by design.
      - path: tests/
        linters:
          - gosec

      # Test helpers close response bodies through t.Cleanup, which bodyclose
      # cannot follow across the function boundary. The bodies *are* closed —
      # this is the analyser's blind spot, not a leak — and contorting the
      # helpers to satisfy it would make the tests worse to read for no
      # correctness gain. Production code is not excluded: that is where a
      # leaked body actually costs something.
      - path: tests/
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
