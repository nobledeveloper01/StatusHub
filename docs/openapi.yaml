# Generated from the router. Do not edit by hand.
#
# Regenerate with:  go run ./cmd/statushubctl openapi > docs/openapi.yaml
#
# CI fails when this file and the routes disagree, because a specification
# maintained beside the code drifts — and a drifted specification is worse
# than none: a generated client calls endpoints that do not exist, omits ones
# that do, and is trusted because it looks authoritative.

openapi: 3.1.0

info:
  title: StatusHub
  version: "1.0.0"
  summary: One webhook receiver in front of every payment provider.
  description: |
    StatusHub sits between a fintech's payment providers and its own systems.
    It verifies each provider's signature, normalises their wildly different
    payloads into one canonical transaction schema, and forwards them with
    per-transaction ordering, bounded retries and replay.

    ## Two surfaces

    Providers POST to a **receiver URL** that is not described here: it takes
    whatever shape that provider sends, and the only thing a customer does
    with it is paste it into the provider's dashboard.

    This document describes the **management API** — endpoints, destinations,
    adapters, the event explorer and replay.

    ## Authentication

    A bearer API key, formatted `sh_{env}_{random}`. A key resolves to exactly
    one tenant and one environment; no key spans either.

    Failures return a bare 401 with no detail. Distinguishing "unknown key"
    from "revoked key" from "wrong environment" would tell a caller which of
    their stolen keys are real.

    A resource belonging to another tenant returns **404, never 403** — a 403
    confirms the resource exists, which is a working cross-tenant enumeration
    oracle. A 403 here means only that your key's role is insufficient for a
    resource that is yours.

    ## Idempotency

    Every write accepts an optional `Idempotency-Key` header. A retry carrying
    the same key returns the original result rather than creating a second
    resource, and the reply carries `Idempotency-Replayed: true`. Reusing a
    key with a different body is a 409.

    ## The status enum

    `status` is always one of six values: `pending`, `success`, `failed`,
    `reversed`, `abandoned`, `unknown`.

    **Handle `unknown` explicitly.** It means StatusHub did not recognise the
    provider's value and refused to guess. The tempting shortcut is to treat
    it as a failure — that is exactly the mistake it exists to prevent, because
    an unmapped SUCCESS treated as a failure reverses a payment that
    completed. `unmapped_status` carries the provider's own string.

  license:
    name: BUSL-1.1
    url: https://github.com/nobledeveloper01/StatusHub/blob/main/LICENSE

servers:
  - url: https://api.statushub.dev
    description: Hosted
  - url: http://localhost:8081
    description: Local, via docker compose

paths:
  /healthz:
    get:
      summary: "Liveness"
      description: |
        Whether the process is alive. Separate from readiness: a readiness failure should remove an instance from rotation, and a health failure should restart it. Conflating them turns a slow database into a restart loop.
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
  /metrics:
    get:
      summary: "Prometheus metrics"
      description: |
        The series from §11.2. `statushub_status_unknown_total{raw_value}` is quietly the most useful of them: a live feed of exactly which provider status values have no mapping yet.
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
  /readyz:
    get:
      summary: "Readiness"
      description: |
        Whether this instance can do its job. For the receiver that means one thing — can it write a raw event — and deliberately says nothing about the dispatcher. A shared probe would take the receiver out of rotation for a dispatcher fault, losing precisely the events persist-then-acknowledge exists to protect.
      operationId: getReadyz
      security: []
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
  /v1/adapters:
    get:
      summary: "List adapters"
      description: |
        Built-in adapters and your own. Each documents its signature scheme, its status mapping, and — where it applies — the ways in which it is weaker than the others. Worth reading before relying on one.
      operationId: getAdapters
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: "Upload a declarative adapter"
      description: |
        Adapters are configuration, not code — which is what lets you support a provider StatusHub has never heard of without opening a ticket.

        Supply `samples`: they are run before the adapter is stored, and one that does not parse blocks the upload. You supplied it as an example of what the provider sends, so an adapter that cannot read it is not ready.
      operationId: postAdapters
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/adapters/infer:
    post:
      summary: "Draft an adapter from sample payloads"
      description: |
        Proposes a configuration with each guess's reasoning and confidence attached. Stores nothing and activates nothing: the amount unit and the timezone are guesses that cost real money when wrong, and both are flagged for review.
      operationId: postAdaptersInfer
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/adapters/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: "Delete a declarative adapter"
      description: |
        Refused while an endpoint still uses it. That endpoint would keep receiving webhooks it could no longer verify, storing every one flagged invalid and forwarding none — which looks exactly like an attack.
      operationId: deleteAdaptersName
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '204':
          description: "Deleted."
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/adapters/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "Dry-run an adapter against sample payloads"
      description: |
        Stores nothing and activates nothing. The useful output is the warnings, not the green tick: an adapter that parses every sample and still has no event ID mapped will duplicate events on the provider's first retry, and nobody discovers that from a pass.
      operationId: postAdaptersNameTest
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/audit:
    get:
      summary: "The audit trail"
      operationId: getAudit
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      parameters:
        - name: since
          in: query
          schema: { type: string }
          description: "RFC 3339. Defaults to 7 days ago."
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/audit/verify:
    get:
      summary: "Verify the hash chain"
      description: |
        Walks your tenant's chain and reports the first break. Returns **409** on a broken chain, so anything polling this sees a failure without parsing the body.

        Exposed to you rather than kept internal on purpose: an audit trail whose integrity only the vendor can check is one you have to take on trust, which is what an audit trail exists to avoid.
      operationId: getAuditVerify
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/deliveries:
    get:
      summary: "Search deliveries"
      operationId: getDeliveries
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: "pending, in_flight, succeeded, failed or dead_letter."
        - name: destination_id
          in: query
          schema: { type: string }
        - name: event_id
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/deliveries/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "Retry a dead letter"
      description: |
        Creates a *new* delivery. The dead letter is preserved: it records what the destination said and when, and overwriting it to try again would destroy the evidence of the failure that prompted the retry.
      operationId: postDeliveriesIdRetry
      security:
        - apiKey: []
      x-statushub-minimum-role: support
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      responses:
        '202':
          description: "Accepted and queued."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/destinations:
    get:
      summary: "List forwarding targets"
      operationId: getDestinations
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: "Create a forwarding target"
      description: |
        Must be HTTPS and must resolve to a publicly routable address. Both are checked here and again inside the dialler at delivery time — validating only at registration is defeated by DNS rebinding.

        A destination keeps the schema version it was created with. A newer version never moves an existing handler on its own.
      operationId: postDestinations
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: ledger
              url: "https://acme.io/hooks/statushub"
              signing_secret_ref: "env://ACME_SIGNING"
              filter:
                statuses: [success, reversed]
      responses:
        '201':
          description: "Created."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/destinations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: "Delete a forwarding target"
      operationId: deleteDestinationsId
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '204':
          description: "Deleted."
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: "Get a forwarding target"
      operationId: getDestinationsId
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/endpoints:
    get:
      summary: "List receiver URLs"
      operationId: getEndpoints
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: "Create a receiver URL"
      description: |
        Returns the URL to paste into the provider's dashboard. That paste is the entire integration — nothing in your codebase changes, except deleting the parsing code you no longer need.

        `secret_ref` is a reference into your secret manager, never a secret. The database holds the reference, so a database dump is not a credential breach.
      operationId: postEndpoints
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      requestBody:
        required: true
        content:
          application/json:
            example:
              provider: paystack
              environment: live
              secret_ref: "env://PAYSTACK_LIVE"
      responses:
        '201':
          description: "Created."
          content:
            application/json:
              example:
                id: ep_06G2R…
                provider: paystack
                environment: live
                adapter: paystack
                receiver_url: "https://hooks.statushub.dev/v1/hooks/acme/paystack/live/tok_9f2a…"
                secret_ref: "env://PAYSTACK_LIVE"
                enabled: true
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/endpoints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: "Delete a receiver URL"
      description: |
        The events it received are retained. Deleting an endpoint removes the URL, not the history — those events are the evidence of what the provider reported and when.
      operationId: deleteEndpointsId
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '204':
          description: "Deleted."
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: "Get a receiver URL"
      operationId: getEndpointsId
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/endpoints/{id}/rotate-token:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "Rotate a receiver token"
      description: |
        Only the token changes; the URL keeps its shape, so rotating is a one-line edit in the provider's dashboard rather than a reconfiguration.

        The previous token stops working immediately. That is the point — a token is rotated because it leaked.
      operationId: postEndpointsIdRotateToken
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/endpoints/{id}/signature-failures:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Requests that failed verification"
      description: |
        Events with an invalid signature are stored, flagged, and never forwarded. Discarding them would destroy the forensic trail of an attack in progress; forwarding them is the vulnerability itself.

        A spike here from one source is a paging alert: a burst of forgery attempts is information you need within minutes.
      operationId: getEndpointsIdSignatureFailures
      security:
        - apiKey: []
      x-statushub-minimum-role: support
      parameters:
        - name: since
          in: query
          schema: { type: string }
          description: "RFC 3339. Defaults to 24 hours ago."
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events:
    get:
      summary: "Search events"
      description: |
        The event explorer. Search by transaction reference when a customer asks about one payment; filter on `mapping_complete=false` to see what StatusHub itself was unsure about.

        Keyset pagination via `cursor`, never OFFSET — this is the largest table anybody queries interactively.
      operationId: getEvents
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      parameters:
        - name: provider
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
          description: "pending, success, failed, reversed, abandoned or unknown."
        - name: event_type
          in: query
          schema: { type: string }
        - name: transaction_ref
          in: query
          schema: { type: string }
        - name: mapping_complete
          in: query
          schema: { type: boolean }
          description: "Set false to find events StatusHub could not fully map."
        - name: from
          in: query
          schema: { type: string }
          description: "RFC 3339."
        - name: to
          in: query
          schema: { type: string }
          description: "RFC 3339."
        - name: cursor
          in: query
          schema: { type: string }
          description: "The `next_cursor` from the previous page."
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events/replay:
    post:
      summary: "Replay by filter or time range"
      description: |
        The recovery tool. **Send `dry_run: true` first** — a bulk replay is the easiest way to send your own systems a million requests at four in the morning, and the dry run tells you how big the window is before you commit to it.

        Destination filters still apply, so a replay does not send an analytics sink the pending events it deliberately excluded.
      operationId: postEventsReplay
      security:
        - apiKey: []
      x-statushub-minimum-role: support
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      requestBody:
        required: true
        content:
          application/json:
            example:
              provider: paystack
              from: "2026-08-11T00:00:00Z"
              to: "2026-08-11T12:00:00Z"
              dry_run: true
      responses:
        '202':
          description: "Accepted and queued."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Get an event and every delivery attempt"
      description: |
        Each attempt with its response code, response body and duration. "Their endpoint returned 400" is not a diagnosis; "returned 400 saying unknown currency" is.
      operationId: getEventsId
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events/{id}/raw:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Get the provider's original payload"
      description: |
        Separately permissioned and separately audited. Raw bodies are the most sensitive thing StatusHub holds — they are whatever the provider chose to send — so reading one is an event in its own right.
      operationId: getEventsIdRaw
      security:
        - apiKey: []
      x-statushub-minimum-role: support
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events/{id}/replay:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "Replay one event"
      description: |
        Sends the stored canonical event again, carrying `X-StatusHub-Replay: true` and the same `Idempotency-Key`, so a handler that already processed it recognises it.

        Nothing is re-normalised: a replay reproduces exactly what you would have received the first time, rather than silently differing because someone edited an adapter last week.
      operationId: postEventsIdReplay
      security:
        - apiKey: []
      x-statushub-minimum-role: support
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      responses:
        '202':
          description: "Accepted and queued."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/keys:
    get:
      summary: "List API keys"
      description: |
        With last-used times, because the most useful thing to do with this list is revoke the keys nobody has used in six months.
      operationId: getKeys
      security:
        - apiKey: []
      x-statushub-minimum-role: owner
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: "Create an API key"
      description: |
        The plaintext appears in this response and nowhere else, ever. It is stored as an Argon2id hash and cannot be recovered.

        Owner only: a key that can issue keys can escalate to any role. A key also cannot issue keys for an environment other than its own.
      operationId: postKeys
      security:
        - apiKey: []
      x-statushub-minimum-role: owner
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Optional. A retry carrying the same key returns the original result rather than creating a second resource. Reusing a key with a different body is a 409."
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: ci
              role: engineer
              environment: live
      responses:
        '201':
          description: "Created."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: "Revoke an API key"
      description: |
        Refused for the key you are authenticated with. Locking yourself out of your own account with no way back in is worse than being technically correct about what revoke means.
      operationId: deleteKeysId
      security:
        - apiKey: []
      x-statushub-minimum-role: owner
      responses:
        '204':
          description: "Deleted."
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/listen:
    get:
      summary: "List active listen sessions"
      description: |
        Visible to the whole team, deliberately: a laptop receiving live production events is something everybody should be able to see.
      operationId: getListen
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: "Start streaming events to a local machine"
      description: |
        Backs `statushubctl listen`. Events are **copied**, never diverted: your real destinations keep receiving everything.

        Engineer role rather than read-only, because streaming live production payloads to an arbitrary machine is a data-egress decision rather than a read.
      operationId: postListen
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/listen/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: "Stop a listen session"
      operationId: deleteListenId
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '204':
          description: "Deleted."
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/listen/{id}/poll:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Long-poll for queued events"
      description: |
        Blocks up to 25 seconds — under the idle timeout most proxies impose without telling anybody — then returns empty. An empty return is the normal case on a quiet endpoint, not an error.
      operationId: getListenIdPoll
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      parameters:
        - name: max
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/listen/{id}/report:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: "Report what the local handler said"
      description: |
        So the CLI's tally and the dashboard's are the same one.
      operationId: postListenIdReport
      security:
        - apiKey: []
      x-statushub-minimum-role: engineer
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/schema-versions:
    get:
      summary: "Payload schema versions"
      description: |
        What shapes are served and when one retires. Published so a version change is something you read about rather than discover from a broken handler.
      operationId: getSchemaVersions
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/unknown-statuses:
    get:
      summary: "Provider values awaiting a mapping"
      description: |
        Ranked by frequency. Each is a provider status StatusHub does not recognise; events carrying them were forwarded as `unknown` rather than guessed at.

        This is the product telling you what to build next instead of waiting for a customer to report it.
      operationId: getUnknownStatuses
      security:
        - apiKey: []
      x-statushub-minimum-role: read_only
      parameters:
        - name: since
          in: query
          schema: { type: string }
          description: "RFC 3339. Defaults to 30 days ago."
      responses:
        '200':
          description: "Success."
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        A key of the form `sh_live_…` or `sh_test_…`. Shown once at
        creation and stored as an Argon2id hash, so it cannot be recovered.

  responses:
    Unauthorised:
      description: |
        The key was not accepted. Deliberately indistinguishable across
        missing, malformed, unknown, revoked, expired and wrong-environment
        keys.
      content:
        application/json:
          example: { "error": "unauthorised" }

    Forbidden:
      description: |
        The key is valid and its role is insufficient. Distinct from 404:
        this resource is yours, and this key may not act on it.
      content:
        application/json:
          example: { "error": "this key has the support role; engineer or higher is required" }

    NotFound:
      description: |
        No such resource — or one belonging to another tenant. The two are
        deliberately identical.
      content:
        application/json:
          example: { "error": "not found" }

  schemas:
    CanonicalEvent:
      type: object
      description: |
        The one shape a destination receives, whichever provider sent the
        event. A customer writes one handler for this and never touches it
        again when a provider is added.
      required: [event_id, event_type, provider, transaction_ref, status, amount_minor, occurred_at, received_at, mapping_complete]
      properties:
        event_id:
          type: string
          description: Also the `Idempotency-Key` on the delivery. Deduplicating on it turns our at-least-once into your exactly-once.
        event_type:
          type: string
          enum: [payment.pending, payment.completed, payment.failed, payment.reversed, payment.abandoned,
                 transfer.pending, transfer.completed, transfer.failed, transfer.reversed,
                 refund.completed, refund.failed, chargeback.opened, chargeback.resolved, unknown]
        provider: { type: string, examples: [paystack, flutterwave, nibss, monnify, interswitch, stripe] }
        provider_event_id:
          type: string
          description: The provider's own identifier, where they supply one. Paystack does not.
        transaction_ref:
          type: string
          description: |
            The ordering and correlation key. Events sharing one are delivered
            sequentially; different references proceed in parallel.
        status:
          type: string
          enum: [pending, success, failed, reversed, abandoned, unknown]
        amount_minor:
          type: integer
          format: int64
          description: |
            Always integer minor units, in the currency's own exponent — kobo
            for NGN, cents for USD, yen for JPY. Never a float, never a
            decimal string, never a unit you have to look up.
        currency: { type: string, minLength: 3, maxLength: 3, examples: [NGN] }
        occurred_at: { type: string, format: date-time, description: Always RFC 3339 UTC. }
        received_at: { type: string, format: date-time }
        customer:
          type: object
          description: |
            Pseudonymised. There is no name, email or phone here and there
            never will be — the hash is enough to correlate two events as one
            person without StatusHub holding who that person is.
          properties:
            ref_hash: { type: string, examples: ["sha256:…"] }
        provider_extra:
          type: object
          additionalProperties: true
          description: |
            Every field the mapping did not claim. Nothing a provider sent is
            dropped: a field nobody knew about today is the one somebody needs
            in six weeks.
        mapping_complete:
          type: boolean
          description: |
            False when StatusHub was unsure about a field. Part of the payload
            rather than an internal flag, because a handler that cannot tell
            the difference has been given no way to know.
        unmapped_status:
          type: string
          description: The provider's own string when `status` is `unknown`.
        redacted:
          type: boolean
          description: Card data was found and removed before storage, so the stored original is not byte-exact.

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
